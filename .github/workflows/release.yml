name: Build & Release APK

on:
  push:
    paths-ignore: ['design/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "TikGrab-v${{ steps.ver.outputs.version }}.apk"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -120 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v5
        with:
          name: TikGrab-v${{ steps.ver.outputs.version }}
          path: TikGrab-v*.apk

      - name: Release notes from whatsnew.json
        if: steps.ver.outputs.exists == 'false'
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('app/src/main/assets/whatsnew.json', encoding='utf-8'))
          out = []
          for key, title in (('new', 'Mới'), ('improved', 'Cải thiện'), ('fixed', 'Sửa lỗi')):
              if w.get(key):
                  out.append(f'### {title}')
                  out += [f'- {x}' for x in w[key]]
                  out.append('')
          out.append('Cài lần đầu: tải file .apk bên dưới về điện thoại và mở để cài. Các lần sau app tự báo khi có bản mới.')
          open('notes.md', 'w', encoding='utf-8').write('\n'.join(out))
          PY

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release create "v$V" "TikGrab-v$V.apk" \
            --title "TikGrab v$V" --notes-file notes.md --target "$GITHUB_SHA" --latest
